name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh tcsh fish
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./tests/version.sh
      - run: cargo build --release
      - run: target/release/linelight check
      - run: ./tests/deploy.sh
      - run: ./tests/completion.sh
