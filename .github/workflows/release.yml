name: release-compat

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  glibc228:
    runs-on: ubuntu-24.04
    container: almalinux:8
    steps:
      - name: Install git
        run: dnf -y install git
      - uses: actions/checkout@v7
      - name: Install build tools
        run: dnf -y install rust cargo gcc binutils tar ca-certificates
      - name: Build
        run: cargo build --release --locked
      - name: Build the exact release tarball
        run: ./scripts/package-release.sh target/release/linelight "${GITHUB_REF_NAME#v}" dist
      - name: Verify the packaged tarball
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          bin=$(find extracted -type f -path '*/bin/linelight' | head -n 1)
          test -x "$bin"
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -V | tail -1)
          test -n "$max"
          test "$(printf '%s\n' "$max" 2.28 | sort -V | tail -1)" = "2.28"
          allowed='libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2 libgcc_s.so.1 ld-linux-x86-64.so.2'
          for needed in $(objdump -p "$bin" | awk '/NEEDED/{print $2}'); do
            case " $allowed " in
              *" $needed "*) ;;
              *) echo "unexpected NEEDED: $needed"; exit 1 ;;
            esac
          done
      - name: Smoke the extracted package on AlmaLinux 8
        run: |
          bin=$(find extracted -type f -path '*/bin/linelight' | head -n 1)
          "$bin" --version
          "$bin" check
          printf 'Filesystem Size Used Avail Use%% Mounted on\n/dev/sda1 100G 1G 99G 1%% /\n' \
            | "$bin" filter --profile df --color always \
            | grep -q $'\033'
          "$bin" run --profile df -- df -h | grep -q Filesystem
      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linelight-glibc228
          path: dist/*

  publish:
    needs: glibc228
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linelight-glibc228
          path: dist
      - name: Publish the exact CI-built assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          version="${tag#v}"
          if ! gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            gh release create "$tag" -R "$repo" --title "linelight $version" --notes "Release $version"
          fi
          gh release upload "$tag" -R "$repo" dist/*.tar.gz dist/*.sha256 --clobber
