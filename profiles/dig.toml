schema = 1
id = "dig"
name = "BIND dig"
description = "Ordinary dig answer format; sections, status, records, addresses."

[[rule]]
regex = '^;;'
style = "muted"

[[rule]]
regex = '^;; (?P<section>ANSWER|AUTHORITY|ADDITIONAL) SECTION:'
groups = { section = "heading" }

[[rule]]
regex = '\bstatus: (?P<ok>NOERROR)'
groups = { ok = "success" }

[[rule]]
regex = '\bstatus: (?P<bad>NXDOMAIN|SERVFAIL|REFUSED|FORMERR)'
groups = { bad = "error" }

[[rule]]
regex = '\b(?P<num>\d+)\b'
groups = { num = "number" }

[[rule]]
regex = '^(?P<name>[^;\s]+)\.\s+\d+\s+IN\s+(?P<type>A|AAAA|CNAME|MX|TXT|NS|SOA|PTR)\s'
groups = { name = "path", type = "identifier" }

[[rule]]
regex = '\b(?P<ip>\d{1,3}(?:\.\d{1,3}){3})\b'
groups = { ip = "identifier" }
