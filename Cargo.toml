[package]
name = "linelight"
version = "2026.10.32"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Standalone, unprivileged output colorizer with embedded profiles"

[dependencies]
regex = "1.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
libc = "0.2"
nix = { version = "0.31", features = ["process", "signal", "term", "fs", "poll", "ioctl"] }
signal-hook = { version = "0.3", features = ["iterator"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
